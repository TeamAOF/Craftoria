name: KubeJS lint

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kubejs
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kubejs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint KubeJS
        run: npx eslint .
