name: KubeJS lint

on:
  push:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kubejs
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kubejs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fix KubeJS lint issues
        run: npx eslint . --fix

      - name: Verify KubeJS lint
        run: npx eslint .

      - name: Commit and push fixes
        working-directory: .
        run: |
          if git diff --quiet; then
            echo "No lint fixes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubejs
          git commit -m "style: auto-fix KubeJS lint issues"
          git push
