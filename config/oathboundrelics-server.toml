[oathbound_relic]
	#If true, players receive an Oathbound Relic the first time they join the world.
	giveStarterOathboundRelic = true
	#Maximum health points lost per unreclaimed Soul Gem. 1.0 = half a heart, 2.0 = one full heart.
	# Default: 1.0
	# Range: 0.0 ~ 20.0
	soulFractureMaxHealthLossPerGem = 1.0
	#Radius in blocks for the owner to consume their Soul Gem.
	# Default: 1.25
	# Range: 0.25 ~ 8.0
	soulGemPickupRadius = 1.25
	#If true, Branded players take extra incoming damage.
	enableFrailty = true
	#Incoming damage multiplier. 2.0 = 100% more damage taken.
	# Default: 2.0
	# Range: 0.0 ~ 100.0
	incomingDamageMultiplier = 2.0
	#If true, nearby neutral mobs become hostile to Branded players.
	enableProvocation = true
	#How often, in ticks, nearby neutral mobs are provoked. 20 = once per second.
	# Default: 20
	# Range: 1 ~ 1200
	neutralAggroInterval = 20
	#Range in blocks for provoking nearby neutral mobs.
	# Default: 16.0
	# Range: 1.0 ~ 128.0
	neutralAggroRange = 16.0
	#If true, armor becomes less effective for Branded players.
	enableShatteredPlate = true
	#Armor effectiveness multiplier. 0.70 = armor is 30% less effective.
	# Default: 0.7
	# Range: 0.0 ~ 1.0
	armorEffectiveness = 0.7
	#If true, Branded players pay health on their first successful damaging attack after the cooldown expires.
	enableBloodToll = true
	#Health points consumed by Blood Toll. 1.0 = half a heart.
	# Default: 1.0
	# Range: 0.0 ~ 20.0
	bloodTollHealthCost = 1.0
	#Cooldown in ticks between Blood Toll triggers. 60 ticks = 3 seconds.
	# Default: 60
	# Range: 0 ~ 72000
	bloodTollCooldownTicks = 60
	#If true, fire lingers longer on Branded players.
	enableLivingEmber = true
	#Minimum fire ticks maintained while the Branded player is burning. 20 ticks = 1 second.
	# Default: 200
	# Range: 0 ~ 12000
	minFireTicks = 200
	#If true, Branded players suffer a penalty after respawning.
	enableSoulFracture = true
	#Weakness duration after respawn, in ticks.
	# Default: 600
	# Range: 0 ~ 72000
	respawnWeaknessDurationTicks = 600
	#Weakness amplifier after respawn. 0 = Weakness I.
	# Default: 0
	# Range: 0 ~ 255
	respawnWeaknessAmplifier = 0
	#Slowness duration after respawn, in ticks.
	# Default: 300
	# Range: 0 ~ 72000
	respawnSlownessDurationTicks = 300
	#Slowness amplifier after respawn. 0 = Slowness I.
	# Default: 0
	# Range: 0 ~ 255
	respawnSlownessAmplifier = 0
	#If true, Branded players cannot sleep.
	enableWakefulDoom = true

[blessings]
	#Optional custom attribute modifiers added to the Oathbound Relic.
	#Blank by default. Add entries only if you want extra blessings or curses.
	#Format: attribute_id;amount;operation;type;display_name
	#operation: ADD_VALUE, ADD_MULTIPLIED_BASE, or ADD_MULTIPLIED_TOTAL
	#type: blessing or curse
	#Example blessing: minecraft:generic.max_health;4.0;ADD_VALUE;blessing;Max Health
	#Example curse: minecraft:generic.movement_speed;-0.10;ADD_MULTIPLIED_TOTAL;curse;Movement Speed
	customAttributes = []
	#If true, the Branded player gains bonus Looting.
	enableLootingBlessing = true
	#Bonus looting levels. 1 = Looting I equivalent.
	# Default: 1
	# Range: 0 ~ 5
	lootingBonus = 1
	#If true, the Branded player gains bonus Fortune.
	enableFortuneBlessing = true
	#Bonus fortune levels. 1 = Fortune I equivalent.
	# Default: 1
	# Range: 0 ~ 5
	fortuneBonus = 1
	#If true, mobs drop more XP for the Branded player.
	enableXpBlessing = true
	#XP multiplier from kills. 2.0 = double XP.
	# Default: 6.0
	# Range: 1.0 ~ 10.0
	xpMultiplier = 6.0
	#If true, the Branded player gets bonus enchanting power at nearby tables.
	enableEnchantingBlessing = true
	#Bonus enchanting power levels added to nearby tables.
	# Default: 10
	# Range: 0 ~ 30
	enchantingPowerBonus = 10
	#If true, the Branded player gains bonus attack speed.
	enableAttackSpeedBlessing = true
	#Bonus attack speed (additive). 0.5 = noticeably faster.
	# Default: 0.5
	# Range: 0.0 ~ 4.0
	attackSpeedBonus = 0.5
	#If true, the Branded player gains absorption when low on health.
	enableAbsorptionBlessing = true
	#Health threshold in health points. 6.0 = 3 hearts.
	# Default: 8.0
	# Range: 1.0 ~ 20.0
	absorptionThreshold = 8.0
	#Absorption amount in health points. 4.0 = 2 hearts.
	# Default: 4.0
	# Range: 1.0 ~ 40.0
	absorptionAmount = 4.0

