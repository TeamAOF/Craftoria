		enabled = true
		#How much Penance is gained from damage taken.
		# Default: 1.5
		# Range: 0.0 ~ 100.0
		penanceGainMultiplier = 1.5
		#Maximum stored Penance.
		# Default: 40.0
		# Range: 0.0 ~ 1000.0
		maxPenance = 40.0
		#Maximum bonus damage added when consuming stored Penance.
		# Default: 12.0
		# Range: 0.0 ~ 1000.0
		maxBonusDamage = 12.0
		#Glowing duration applied to the struck target when Penance is consumed.
		# Default: 100
		# Range: 0 ~ 72000
		markDurationTicks = 100

	[bearer_curios.eye_of_the_sleepless_witness]
		#If true, Eye of the Sleepless Witness is enabled.
		enabled = true
		#If true, the bearer receives infinite Night Vision while worn.
		nightVision = true
		#Nearby hostile reveal radius while moving.
		# Default: 14.0
		# Range: 1.0 ~ 256.0
		revealRadiusMoving = 14.0
		#Nearby hostile reveal radius while standing still.
		# Default: 24.0
		# Range: 1.0 ~ 256.0
		revealRadiusStill = 24.0
		#Glowing duration applied to nearby hostiles.
		# Default: 60
		# Range: 0 ~ 72000
		glowDurationTicks = 60
		#Oakskin Resistance duration in ticks.
		# Default: 80
		# Range: 0 ~ 72000
		oakskinDurationTicks = 80
		#Oakskin Resistance amplifier. 0 = Resistance I.
		# Default: 0
		# Range: 0 ~ 255
		oakskinAmplifier = 0
		#Maximum horizontal movement squared for Oakskin to count as 'holding your ground'.
		# Default: 0.02
		# Range: 0.0 ~ 4.0
		oakskinMovementThreshold = 0.02

