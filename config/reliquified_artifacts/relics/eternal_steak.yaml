                    # Type of mathematical operation used to calculate the stat's value based on the ability level.
                    scalingModel: relics:multiplicative_base
                    # Value the stat reaches when both the stat quality and ability level are at their maximum.
                    targetValue: 0.7505
                durability:
                    # Maximum base value of the stat. A random value within this range is assigned when the relic is first created
                    maxInitialValue: 3.0
                    # Maximum threshold value for the stat, representing hard limits that cannot be surpassed through ability level upgrades or other methods
